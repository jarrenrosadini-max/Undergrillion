name: Weekly leak update

on:
  schedule:
    - cron: '17 15 * * 1'   # Mondays ~7-8am Pacific
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pull community trackers
        id: pull
        run: node tools/update-leaks.mjs
      - name: Check data still valid
        run: node tests/engine.test.mjs
      - name: Open a pull request for review
        uses: peter-evans/create-pull-request@v7
        with:
          branch: bot/leak-update
          delete-branch: true
          commit-message: "Leak update from community trackers"
          title: "Leak update: ${{ steps.pull.outputs.added }} new leaks"
          body-path: tools/.last-update.md
          labels: leaks
          add-paths: site/data/leaks.json
