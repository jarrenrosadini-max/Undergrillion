name: Build catalog

on:
  push:
    branches: [main]
    paths: ['tools/roster.json', 'tools/overrides.json', 'tools/build-catalog.mjs']
  schedule:
    - cron: '17 15 * * 1'   # weekly refresh, Mondays
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: catalog
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pull discographies and leaks
        run: node tools/build-catalog.mjs
      - name: Report
        run: cat tools/catalog-report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Commit catalog
        run: |
          git config user.name "undergrillion-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/catalog.json tools/catalog-report.md
          git diff --cached --quiet && exit 0
          git commit -m "Catalog refresh $(date -u +%F)"
          git pull --rebase origin main
          git push origin HEAD:main
